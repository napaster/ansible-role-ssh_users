---
- name: "Include sudo group determination"
  include_tasks: determine_sudo_group.yml
- name: ssh_users | Remove authorized_keys
  file:
    path: "/etc/ssh/authorized_keys"
    state: "absent"
- name: ssh_users | Create users
  user:
    name: "{{ item.key }}"
    uid: "{{ item.value.uid }}"
    group: "root"
    groups: "{{ sudo_group }}"
    shell: "/bin/bash"
    createhome: "yes"
    generate_ssh_key: "no"
    remove: "yes"
    force: "yes"
    state: "{{ item.value.state }}"
  loop: "{{ hostvars[inventory_hostname][target_group] | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
- name: ssh_users | Create ssh keys
  authorized_key:
    user: "{{ item.key }}"
    key: "{{ item.value.rsa }}"
    state: "{{ item.value.state }}"
    exclusive: "yes"
  loop: "{{ hostvars[inventory_hostname][target_group] | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
