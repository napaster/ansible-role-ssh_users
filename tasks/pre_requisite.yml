---
- name: ssh_users | Set effective target group
  set_fact:
    ssh_users_effective_target_group:
      "{{ hostvars[inventory_hostname]['target_group'] |
      default(ssh_users_default_target_group) }}"

- name: ssh_users | Set default user filter
  set_fact:
    ssh_users_effective_users: "{{ ssh_users_default_users | default([]) }}"
  when:
    - "hostvars[inventory_hostname]['target_group'] is not defined"
    - "hostvars[inventory_hostname]['ssh_users_effective_users'] is not defined"

- name: ssh_users | Set explicit user filter
  set_fact:
    ssh_users_effective_users: "{{ hostvars[inventory_hostname]['target_users'] }}"
  when:
    - "hostvars[inventory_hostname]['target_users'] is defined"
    - "hostvars[inventory_hostname]['target_users'] not in ['', [], '[]', None]"

- name: ssh_users | Assert that target group variable is defined
  assert:
    that:
    - "hostvars[inventory_hostname]['ssh_users_effective_target_group'] is defined"
    - "hostvars[inventory_hostname]['ssh_users_effective_target_group'] != ''"
    - "hostvars[inventory_hostname][ssh_users_effective_target_group] is defined"
    - "hostvars[inventory_hostname][ssh_users_effective_target_group] not in
      ['', {}, '{}', None]"
    msg: "Target group is not defined."
    quiet: "true"
